services:
  pcb-detector-api:
    build:
      context: .
      dockerfile: api/Dockerfile.gpu
    container_name: pcb_detector_api
    ports:
      - "8001:8000"
    environment:
      - MODEL_PATH=/app/runs/detect/pcb_defect_yolov10/weights/best.pt
      - MAX_UPLOAD_MB=10
    volumes:
      # Montaje de solo lectura para salvaguardar pesos y dataset en producción
      - ./runs:/app/runs:ro
      - ./dataset:/app/dataset:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

